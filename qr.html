<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escanea - Centro Odontológico Sonrisa Sana</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
      background: linear-gradient(135deg, var(--primario) 0%, #312e81 100%);
    }

    .qr-tarjeta {
      background: #fff;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      text-align: center;
      max-width: 540px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }

    .qr-tarjeta img {
      width: min(340px, 72vw);
      height: auto;
      display: block;
      margin: 1.5rem auto;
    }

    .qr-url {
      font-weight: 600;
      font-size: 1.05rem;
      color: var(--primario-oscuro);
      word-break: break-all;
    }

    /* Al imprimir: fondo blanco y sin botones */
    @media print {
      body {
        background: #fff;
        padding: 0;
      }
      .qr-tarjeta {
        box-shadow: none;
        border: 2px solid var(--borde);
        max-width: 640px;
      }
      .no-imprimir {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="qr-tarjeta">
    <span style="font-size:2.4rem;">&#129463;</span>
    <h1 style="font-size:1.5rem;margin-top:0.4rem;">Centro Odontológico Sonrisa Sana</h1>
    <p style="color:var(--texto-suave);">Escanea el código con tu celular para abrir la página</p>

    <img src="img/qr.svg" alt="Código QR para abrir la página de Sonrisa Sana" />

    <p class="qr-url">https://cyberlock-ar.github.io/BaseDeDatos/index.html</p>

    <p class="no-imprimir" style="margin-top:1.6rem;display:flex;gap:0.6rem;justify-content:center;flex-wrap:wrap;">
      <a class="btn btn-primario" href="index.html">Ir a la página</a>
      <button class="btn btn-secundario" onclick="window.print()">Imprimir</button>
    </p>
  </div>
</body>
</html>
