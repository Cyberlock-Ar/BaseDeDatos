<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro de paciente - Sonrisa Sana</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <nav class="navbar">
    <div class="contenedor">
      <a href="index.html" class="logo">
        <span class="icono">&#129463;</span>
        Sonrisa Sana
      </a>
      <div class="nav-enlaces">
        <a class="btn btn-fantasma" href="index.html">Volver al inicio</a>
        <a class="btn btn-primario" href="index.html">Iniciar sesión</a>
      </div>
    </div>
  </nav>

  <main class="seccion">
    <div class="contenedor" style="max-width:640px;">
      <div class="tarjeta">
        <div class="titulo-seccion" style="margin-bottom:1.5rem;">
          <h2>Crear cuenta de paciente</h2>
          <p>Completa tus datos para agendar citas en línea</p>
        </div>

        <form class="formulario" id="form-registro">
          <div class="formulario-2">
            <div class="campo">
              <label for="reg-nombre">Nombre completo *</label>
              <input type="text" id="reg-nombre" required maxlength="80" placeholder="Ej: María López" />
            </div>
            <div class="campo">
              <label for="reg-edad">Edad *</label>
              <input type="number" id="reg-edad" required min="1" max="120" placeholder="Ej: 30" />
            </div>
            <div class="campo">
              <label for="reg-genero">Género</label>
              <select id="reg-genero">
                <option value="">Selecciona...</option>
                <option>Masculino</option>
                <option>Femenino</option>
                <option>Otro</option>
              </select>
            </div>
            <div class="campo">
              <label for="reg-telefono">Teléfono</label>
              <input type="tel" id="reg-telefono" maxlength="15" placeholder="Ej: 3124567890" />
            </div>
          </div>

          <div class="campo">
            <label for="reg-direccion">Dirección</label>
            <input type="text" id="reg-direccion" maxlength="120" placeholder="Ej: Cra 10 #11-12" />
          </div>

          <div class="campo">
            <label for="reg-email">Correo electrónico *</label>
            <input type="email" id="reg-email" required placeholder="tucorreo@ejemplo.com" />
          </div>

          <div class="campo">
            <label for="reg-clave">Contraseña *</label>
            <input type="password" id="reg-clave" required minlength="6" placeholder="Mínimo 6 caracteres" />
          </div>

          <div class="alerta alerta-error oculto" id="reg-error"></div>
          <div class="alerta alerta-exito oculto" id="reg-exito"></div>

          <button type="submit" class="btn btn-primario btn-ancho" id="btn-registro">
            Crear cuenta
          </button>

          <p style="text-align:center;font-size:0.9rem;">
            ¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a>
          </p>
        </form>
      </div>
    </div>
  </main>

  <footer class="footer">
    Centro Odontológico Sonrisa Sana &copy; 2026 &mdash; Proyecto de Base de Datos
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Si ya hay sesión, ir al panel
    (async () => {
      const session = await obtenerSesion();
      if (session) window.location.href = "paciente.html";
    })();

    document.getElementById("form-registro").addEventListener("submit", async (e) => {
      e.preventDefault();
      limpiarError("reg-error");
      limpiarError("reg-exito");

      const btn = document.getElementById("btn-registro");
      btn.disabled = true;
      btn.textContent = "Creando cuenta...";

      const email = document.getElementById("reg-email").value.trim();
      const password = document.getElementById("reg-clave").value;

      // Los datos del perfil viajan como metadatos;
      // el trigger en Supabase crea la fila en "usuarios"
      const opciones = {
        data: {
          nombre: document.getElementById("reg-nombre").value.trim(),
          edad: document.getElementById("reg-edad").value,
          genero: document.getElementById("reg-genero").value,
          telefono: document.getElementById("reg-telefono").value.trim(),
          direccion: document.getElementById("reg-direccion").value.trim(),
        },
      };

      const { data, error } = await db.auth.signUp({ email, password, options: opciones });

      if (error) {
        mostrarError("reg-error", "Error: " + error.message);
        btn.disabled = false;
        btn.textContent = "Crear cuenta";
        return;
      }

      // Si Supabase pide confirmar correo, no hay sesión todavía
      if (!data.session) {
        mostrarError("reg-exito", "Cuenta creada. Revisa tu correo para confirmar y luego inicia sesión.");
        btn.disabled = false;
        btn.textContent = "Crear cuenta";
        return;
      }

      window.location.href = "paciente.html";
    });
  </script>
</body>
</html>
